# Test profile: in-memory H2 in PostgreSQL mode, schema generated from the entities.
# The real schema (constraints, exclusion rules) is covered by supabase/migrations.
spring:
  datasource:
    url: jdbc:h2:mem:propfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS propfolio
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  openai:
    api-key: test-key
    base-url: http://openai.invalid/v1
  bills:
    # Tests trigger readings explicitly; uploads don't start one.
    auto-extract: false
  extraction:
    # Run readings on the calling thread so tests can check the result straight away.
    inline: true
  storage:
    # Shared temp folder; tests use random landlord ids, so files never collide.
    local-root: ${java.io.tmpdir}/propfolio-test-storage
  supabase:
    url: https://test-project.supabase.co
    jwks-uri: https://test-project.supabase.co/auth/v1/.well-known/jwks.json
