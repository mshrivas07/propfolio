spring:
  application:
    name: propfolio-api
  profiles:
    default: local
  # Loads backend/.env (KEY=value lines) when the app runs from the backend/ folder.
  # Values are then available to the ${...} placeholders below.
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # BillService enforces the real 10 MB limit with a clear message; these container
      # limits sit a little higher so that message is what users see.
      max-file-size: 12MB
      max-request-size: 12MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by supabase/migrations; Hibernate only checks entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: propfolio

server:
  port: ${SERVER_PORT:8080}

app:
  # Decides when a lease counts as current / ended ("today").
  time-zone: ${APP_TIME_ZONE:America/Toronto}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Folder where uploaded bills are kept. Relative paths resolve from the working directory (backend/).
    local-root: ${APP_STORAGE_LOCAL_ROOT:./storage}
  supabase:
    url: ${SUPABASE_URL}
    jwks-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}

  openai:
    # Never commit the key; put it in backend/.env as OPENAI_API_KEY.
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    # Any current vision-capable model. gpt-6-luna is OpenAI's low-cost model for high-volume tasks;
    # try gpt-6.1-terra if readings of your bills aren't accurate enough.
    model: ${OPENAI_MODEL:gpt-6-luna}
    timeout: ${OPENAI_TIMEOUT:90s}
  bills:
    # Read each bill with OpenAI right after upload.
    auto-extract: ${APP_BILLS_AUTO_EXTRACT:true}
    # Combined confidence (0–1) a bill needs, with no review issues, to be marked READY.
    ready-threshold: ${APP_BILLS_READY_THRESHOLD:0.85}
    # A reading still unfinished after this long is shown as failed and can be re-run.
    extraction-stalled-after: 10m

# Added in later phases (values come from environment variables, never committed):
#   Phase 6: app.google.client-id, app.google.client-secret, app.google.redirect-uri
